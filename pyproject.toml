[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "dicehub-python"
dynamic = ["version"]
description = "Python SDK, CLI, and agent automation for dicehub"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "dicehub contributors" }]
keywords = ["dicehub", "simulation", "cfd", "automation", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=2.13.4,<3",
  "typer>=0.27.0,<1",
]

[project.scripts]
dicehub = "dicehub.cli:main"

[project.urls]
Homepage = "https://dicehub.com"
Repository = "https://github.com/dicehub/dicehub-python"
Documentation = "https://github.com/dicehub/dicehub-python/blob/dev/docs/index.md"
Support = "https://dicehub.com/contact-us"

[tool.hatch.version]
path = "VERSION"
pattern = '(?P<version>\S+)'

[tool.hatch.build.targets.wheel]
packages = ["dicehub"]

[tool.hatch.build.targets.sdist]
include = [
  "/dicehub",
  "/docs",
  "/examples",
  "/requirements",
  "/scripts",
  "/tests",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/VERSION",
  "/pyproject.toml",
]

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests against a running dicehub API or installed executable",
  "live: opt-in tests against a locally running dicehub API",
  "mutating: tests that create, update, or delete live dicehub data",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
